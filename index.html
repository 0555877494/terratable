<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terra & Table — Artisan Specialty Food Marketplace</title>
    <meta name="description" content="Discover the world's finest specialty foods. Handpicked delicacies from artisan producers worldwide, delivered fresh to your door." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      html.light, html.light body {
        background-color: #fffefb !important;
      }
      /* Loading screen */
      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #fef9f3, #fef9f0, #f3f7f2);
        z-index: 9999;
        transition: opacity 0.5s, visibility 0.5s;
      }
      #loader.hidden {
        opacity: 0;
        visibility: hidden;
      }
      .loader-content {
        text-align: center;
      }
      .loader-logo {
        width: 56px;
        height: 56px;
        background: linear-gradient(135deg, #e47a2b, #ab1f45);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
        animation: pulse 1.5s ease-in-out infinite;
        box-shadow: 0 8px 24px rgba(228, 122, 43, 0.3);
      }
      .loader-logo span {
        color: white;
        font-family: 'Playfair Display', serif;
        font-size: 24px;
        font-weight: 700;
      }
      .loader-text {
        font-family: 'Playfair Display', serif;
        font-size: 18px;
        color: #73331b;
        font-weight: 600;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
    </style>
    <script>
      (function () {
        document.documentElement.classList.add("light");
      })();
    </script>
  </head>
  <body>
    <div id="loader">
      <div class="loader-content">
        <div class="loader-logo"><span>T</span></div>
        <p class="loader-text">Terra & Table</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loader = document.getElementById('loader');
          if (loader) loader.classList.add('hidden');
        }, 800);
      });
    </script>
  </body>
</html>
